name: Release DUM-E Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone binary
        run: |
          mkdir -p dist-bin
          bun build --compile --minify ./packages/coding-agent/src/cli.ts --outfile ./dist-bin/dume-${{ matrix.target }}
          chmod +x ./dist-bin/dume-${{ matrix.target }}

      - name: Upload Binary Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist-bin/dume-${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
