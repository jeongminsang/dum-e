name: Build Native Binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Create native source archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ./scripts/create-source-archive.sh --version "${RELEASE_TAG#v}" --ref HEAD \
            --out "release-assets/dume-${RELEASE_TAG#v}-source.tar.gz"
          cd release-assets
          sha256sum ./*.tar.gz > source.sha256
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-source
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  build:
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python3
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download native source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-source
          path: source-assets
      - name: Verify and extract source
        run: |
          set -euo pipefail
          "$PYTHON" - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path('source-assets')
          name = f"dume-{os.environ['RELEASE_TAG'][1:]}-source.tar.gz"
          digest, entry = (root / 'source.sha256').read_text().strip().split('  ', 1)
          if entry != './' + name:
              raise SystemExit('Unexpected source checksum entry')
          with (root / name).open('rb') as source:
              if hashlib.file_digest(source, 'sha256').hexdigest() != digest:
                  raise SystemExit('Source checksum mismatch')
          PY
          mkdir source
          tar -xzf "source-assets/dume-${RELEASE_TAG#v}-source.tar.gz" --strip-components=1 -C source
      - name: Install native Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Cache native Rust dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
          key: native-${{ matrix.platform }}-rust-1.96.0-${{ hashFiles('source/Cargo.lock') }}-${{ inputs.commit }}
          restore-keys: |
            native-${{ matrix.platform }}-rust-1.96.0-${{ hashFiles('source/Cargo.lock') }}-
            native-${{ matrix.platform }}-rust-1.96.0-
      - name: Fetch locked native dependencies
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo fetch --manifest-path source/Cargo.toml --locked --target "$host"
      - name: Test, build, and smoke extracted release archive
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bash source/scripts/build-binaries.sh --offline \
            --platform "$NATIVE_PLATFORM" --out "$GITHUB_WORKSPACE/release-assets"
      - name: Upload verified native archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
