name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rust:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Cache Rust dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workspace-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            workspace-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-${{ hashFiles('Cargo.lock') }}-
            workspace-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-
      - name: Fetch locked dependencies
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo fetch --locked --target "$host"
      - name: Check native workspace
        run: cargo check --workspace --locked --offline
      - name: Test, build, and smoke native archive
        run: |
          bash scripts/build-binaries.sh --offline \
            --platform darwin-arm64 --out "$RUNNER_TEMP/dume-native-ci"
