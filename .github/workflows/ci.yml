name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Check native workspace
        run: cargo check --workspace --locked
      - name: Test native workspace
        run: cargo test --workspace --locked
      - name: Build native product
        run: cargo build --release -p dume-cli --bin dume --locked
      - name: Smoke native product outside checkout
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/target/release/dume" --help
          "${GITHUB_WORKSPACE}/target/release/dume" --version
