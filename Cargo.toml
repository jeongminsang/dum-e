[workspace]
resolver = "3"
members = [
    "crates/dume-core",
    "crates/dume-store",
    "crates/dume-git",
    "crates/dume-worker",
    "crates/dume-mcp",
    "crates/dume-provider",
    "crates/dume-tui",
    "crates/dume-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeongminsang/dum-e"
authors = ["DUM-E Contributors"]

[workspace.dependencies]
dume-core = { path = "crates/dume-core" }
dume-store = { path = "crates/dume-store" }
dume-git = { path = "crates/dume-git" }
dume-worker = { path = "crates/dume-worker" }
dume-mcp = { path = "crates/dume-mcp" }
dume-provider = { path = "crates/dume-provider" }
dume-tui = { path = "crates/dume-tui" }

tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.17"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
futures-util = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
base64 = "0.22"


