[workspace]
resolver = "3"
members = [
    "crates/dume-core",
    "crates/dume-store",
    "crates/dume-git",
    "crates/dume-worker",
    "crates/dume-mcp",
    "crates/dume-provider",
    "crates/dume-tui",
    "crates/dume-cli",
]

[workspace.package]
version = "0.1.10"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeongminsang/dum-e"
authors = ["DUM-E Contributors"]

[workspace.dependencies]
dume-core = { path = "crates/dume-core" }
dume-store = { path = "crates/dume-store" }
dume-git = { path = "crates/dume-git" }
dume-worker = { path = "crates/dume-worker" }
dume-mcp = { path = "crates/dume-mcp" }
dume-provider = { path = "crates/dume-provider" }
dume-tui = { path = "crates/dume-tui" }

tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["full"] }
rusqlite = { version = "=0.33.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
tempfile = "=3.27.0"
clap = { version = "=4.6.6", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.34"
ratatui = "=0.29.0"
crossterm = { version = "=0.28.1", features = ["event-stream"] }
unicode-width = "=0.2.0"
base64 = "=0.22.1"


